<div class="modulex-text-module-body">{{name}}</div>
<style>
  /* Metin modülü: qrmenus ve benzeri projelerde kısa metin / başlık alanı */
  .modulex-text-module-body {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: --margin--;
    padding: --padding--;
    font-size: --font-size--;
    color: --color--;
    font-weight: 600;
    text-align: center;
    line-height: 1.5;
    border-radius: 8px;
    background: --bgcolor--;
    -webkit-font-smoothing: antialiased;
  }
  @media screen and (max-width: 768px) {
    .modulex-text-module-body {
      padding: 12px;
    }
  }

  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"] {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
